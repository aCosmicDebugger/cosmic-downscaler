[project]
name = "cosmic-downscaler"
version = "0.1.0"
description = "Regional atmosferic downscaling framework using ERA6 and BRAMS data."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pip>=26.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cosmic_downscaler"]
